<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جداول السكن</title>
<meta name="theme-color" content="#0c6b63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="السكن">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Housing board: sage-grey ground and a deep teal brand. Green means a free bed or someone entering; red means a taken bed or someone leaving.
     Layout: phone-first column. Housing switch on top, rooms grid in the middle, two thumb-sized buttons fixed at the bottom. */
  --bg:#edf1ee; --surface:#ffffff; --ink:#16222a; --muted:#56656c; --line:#d2dad5; --accent:#0c6b63;
  --h-w:#0c6b63; --h-a:#3b4c9b;
  --in:#1d8549; --in-soft:#dcf1e3; --out:#c0412b; --out-soft:#f9e1db; --warn:#9a6300; --warn-soft:#f6ead0; --idle:#86939a; --idle-soft:#e6eaeb;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 6px 18px rgba(20,40,40,.07);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1517;--surface:#162125;--ink:#e4ecea;--muted:#a3b4b6;--line:#2b3b40;--accent:#47b5a7;--h-w:#47b5a7;--h-a:#97a5f4;
  --in:#4fc686;--in-soft:#15342a;--out:#f2826b;--out-soft:#3a201b;--warn:#e5b04f;--warn-soft:#352b15;--idle:#76848a;--idle-soft:#222d31;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517;--surface:#162125;--ink:#e4ecea;--muted:#a3b4b6;--line:#2b3b40;--accent:#47b5a7;--h-w:#47b5a7;--h-a:#97a5f4;
  --in:#4fc686;--in-soft:#15342a;--out:#f2826b;--out-soft:#3a201b;--warn:#e5b04f;--warn-soft:#352b15;--idle:#76848a;--idle-soft:#222d31;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.emoji{font-family:var(--emoji);line-height:1}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---------- top ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.brand h1{font-family:var(--font-display);font-size:20px;margin:0;line-height:1.2;text-wrap:balance}
.brand .sub{margin:0;font-size:13px;color:var(--muted)}
.brand .grow{flex:1;min-width:0}
.icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.hswitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.htab{display:flex;align-items:center;gap:8px;min-height:58px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:start}
.htab .hname{font-weight:700;font-size:16px;flex:1;line-height:1.25}
.htab .hico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 14%,transparent);color:var(--hc)}
.htab .hfree{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--in);font-size:15px}
.htab .hfree .ic{width:18px;height:18px}
.htab.on{border-color:var(--hc);background:color-mix(in srgb,var(--hc) 9%,var(--surface));box-shadow:inset 0 -4px 0 var(--hc)}
.stats{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.stat{flex:1;min-width:84px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.free b{color:var(--in)}
.stat.warn{background:var(--warn-soft);border-color:transparent}
.stat.warn b{color:var(--warn)}
.tools{display:flex;gap:8px;margin-top:10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;width:100%;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-height:46px;font-weight:600;font-size:14px;white-space:nowrap}
.chip .ic{width:18px;height:18px}
.chip.on{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.banner{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.banner .ic{margin-top:2px}

/* ---------- rooms grid ---------- */
main{padding-top:14px;padding-bottom:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}}
.room{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;min-height:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.room .rn{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.room .flags{position:absolute;top:5px;inset-inline-start:6px;font-size:13px;display:flex;gap:1px}
.room .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:70px}
.d{width:11px;height:11px;border-radius:50%;display:block}
.d.on{background:var(--out)}
.d.free{background:var(--in-soft);box-shadow:inset 0 0 0 2px var(--in)}
.d.over{background:var(--warn)}
.room .cnt{font-size:12px;color:var(--muted);font-weight:600}
.room.has-free{border-color:var(--in);box-shadow:inset 0 0 0 1px var(--in),var(--shadow)}
.room.over{border-color:var(--warn)}
.room.over .cnt{color:var(--warn)}
.room.blocked,.room.util{background:var(--idle-soft);box-shadow:none;color:var(--muted)}
.room.blocked .rn,.room.util .rn{color:var(--muted)}
.room .tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.room .tag .ic{width:14px;height:14px}
.room.pick-sugg{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.room .star{position:absolute;top:4px;inset-inline-end:6px;color:var(--accent)}
.room .star .ic{width:16px;height:16px;fill:currentColor}
.qb{width:20px;height:20px;border-radius:50%;background:var(--warn);color:var(--surface);font-weight:800;font-size:13px;display:inline-grid;place-items:center;line-height:1;flex:none}
.room .qb{position:absolute;bottom:6px;inset-inline-end:6px}
.chip.miss.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip[hidden]{display:none}
.qtag{color:var(--warn);font-weight:700}
.tickbox{width:28px;height:28px;border-radius:8px;border:2px solid var(--out);display:grid;place-items:center;flex:none;color:#fff}
.tickbox .ic{width:18px;height:18px}
.wrow.sel .tickbox{background:var(--out)}
.wrow.unsel{opacity:.55}
.vrow-end{font-size:12.5px;color:var(--out);font-weight:700}
.banner.vac{cursor:pointer;width:100%;text-align:start;border:0;font:inherit}
.small-btn.danger{color:var(--out);border-color:var(--out)}
.sumbox{width:100%;min-height:260px;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink)}
.tile small{display:block}
.sec-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:18px 0 10px;color:var(--muted)}
.sec-title:first-child{margin-top:0}
.empty-note{padding:24px;text-align:center;color:var(--muted)}

/* ---------- action bar ---------- */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 12px}
.bar .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:16px;border:0;font-family:var(--font-display);font-weight:700;font-size:20px;color:#fff;box-shadow:var(--shadow)}
.big .ic{width:30px;height:30px}
.big.in{background:var(--in)}
.big.out{background:var(--out)}
.big.neutral{background:var(--accent)}
.big.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.big:disabled{opacity:.45;cursor:not-allowed}
:root[data-theme="dark"] .big.in,:root[data-theme="dark"] .big.out,:root[data-theme="dark"] .big.neutral{color:#0e1517}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big.in,:root:not([data-theme="light"]) .big.out,:root:not([data-theme="light"]) .big.neutral{color:#0e1517}}

/* ---------- sheets ---------- */
#sheets .sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:700px){
  #sheets .sheet{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(600px,94vw);max-height:92vh;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  #sheets .sheet.wide{width:min(1040px,96vw)}
  #scrim{position:fixed;inset:0;z-index:19;background:rgba(10,20,22,.45)}
}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head h2{flex:1;margin:0;font-family:var(--font-display);font-size:19px;line-height:1.25;text-wrap:balance;display:flex;align-items:center;gap:8px}
.sh-head h2 .ic{width:26px;height:26px}
.sh-head.in{box-shadow:inset 0 -4px 0 var(--in)}
.sh-head.out{box-shadow:inset 0 -4px 0 var(--out)}
.sh-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sh-foot{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:10px}
.sh-foot.two{grid-template-columns:1fr 1fr}
.steps{display:flex;gap:5px;align-items:center}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--ink)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:138px;padding:14px 10px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;text-align:center;box-shadow:var(--shadow)}
.tile .ic{width:46px;height:46px}
.tile small{font-weight:500;font-size:13px;color:var(--muted)}
.tile.in{color:var(--in)} .tile.out{color:var(--out)} .tile.acc{color:var(--accent)}
.tile.in span,.tile.out span,.tile.acc span{color:var(--ink)}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row}
.tile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

.paste{width:100%;min-height:220px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);padding:14px;font-size:16px;line-height:1.6;resize:vertical}
.paste:focus{border-color:var(--accent);border-style:solid;outline:0}
.hint{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:10px 2px}
.hint .ic{width:26px;height:26px;color:var(--accent)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:30px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
.lead{font-size:18px;font-weight:600}

/* keypad */
.kp-show{font-family:var(--font-display);font-size:38px;font-weight:700;text-align:center;letter-spacing:2px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;min-height:72px;font-variant-numeric:tabular-nums;direction:ltr}
.kp-show .ph{color:var(--line)}
.kp-label{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;margin-bottom:10px;color:var(--muted)}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;direction:ltr}
.key{min-height:62px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:28px;font-weight:600;box-shadow:var(--shadow)}
.key.ok{background:var(--in);color:#fff;border-color:transparent}
.key.del{color:var(--out)}
.key:active{transform:scale(.97)}

/* worker cards */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.whead{display:flex;align-items:center;gap:12px}
.whead .flag{font-size:40px}
.wname{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.25;direction:ltr;text-align:right;unicode-bidi:plaintext}
.wsub{color:var(--muted);font-size:14px}
.fields{display:grid;gap:8px;margin-top:12px}
.field{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);min-height:56px}
.field .fi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--muted);flex:none}
.field .fl{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.field .fv{display:block;font-weight:700;font-size:17px;line-height:1.3;word-break:break-word}
.field .fb{flex:1;min-width:0}
.field .pen{color:var(--muted)}
.field .pen .ic{width:18px;height:18px}
.field.missing{border-color:var(--warn);background:var(--warn-soft)}
.field.static{cursor:default}
.match{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.match.present{background:var(--warn-soft)}
.match.absent{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.status.in{background:var(--in-soft);color:var(--in)}
.status.out{background:var(--idle-soft);color:var(--muted)}
.list{display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:62px}
.wrow .flag{font-size:28px}
.wrow .wb{flex:1;min-width:0}
.wrow .wn{font-weight:700;direction:ltr;text-align:right;unicode-bidi:plaintext;overflow-wrap:anywhere}
.wrow .ws{font-size:13px;color:var(--muted)}
.wrow .rbadge{font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--bg);border-radius:10px;padding:4px 10px;white-space:nowrap}
.wrow.gone{opacity:.7}
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:96px;text-align:center;font-weight:600;font-size:14px;line-height:1.25}
.opt .emoji{font-size:34px}
.opt small{font-size:11px;color:var(--muted);font-weight:500}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

.confirm{display:grid;gap:14px;justify-items:center;text-align:center}
.confirm .arrow{color:var(--muted)}
.confirm .arrow .ic{width:34px;height:34px;transform:rotate(90deg)}
.bigroom{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 28px;border-radius:20px;border:2px solid var(--accent);background:var(--surface)}
.bigroom .rn{font-family:var(--font-display);font-size:54px;font-weight:700;line-height:1}
.bigroom .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:180px}
.bigroom .d{width:18px;height:18px}
.d.new{background:var(--in);box-shadow:0 0 0 4px var(--in-soft);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--in-soft)}}
.done{display:grid;justify-items:center;gap:12px;text-align:center;padding-top:20px}
.okmark{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--in);color:#fff;animation:pop .35s ease-out}
.okmark.out{background:var(--out)}
.okmark .ic{width:64px;height:64px;stroke-width:3}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.done .big-n{font-family:var(--font-display);font-size:30px;font-weight:700}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:14px;padding:10px 12px;font-size:15px;margin:10px 0}
.warnbox .ic{color:var(--warn);margin-top:2px}

/* forms */
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input,.form select,.form textarea{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;min-height:48px;font-size:16px}
.form .ltr{direction:ltr;text-align:right}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:24px;font-weight:700}
.stepper b{font-family:var(--font-display);font-size:26px;min-width:40px;text-align:center}
.toggle{display:flex!important;grid-template-columns:none!important;align-items:center;gap:10px;font-weight:600}
.toggle input{width:24px;height:24px;min-height:0}

/* menu / tables / log */
.menu{display:grid;gap:10px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;min-height:62px}
.mitem small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.mitem .ic{color:var(--accent);width:26px;height:26px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;min-height:44px}
.seg button.on{background:var(--accent);color:#fff}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
table.t{border-collapse:collapse;font-size:13px;min-width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;white-space:nowrap;text-align:start;unicode-bidi:plaintext}
table.t th{position:sticky;top:0;background:var(--idle-soft);z-index:1}
table.t td.n{font-variant-numeric:tabular-nums}
table.t tr.gone td{color:var(--muted)}
table.t tr.empty td{background:color-mix(in srgb,var(--h-a) 12%,var(--surface))}
.logitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.logitem .lb{flex:1;min-width:0;font-size:14px}
.logitem .lt{font-size:12px;color:var(--muted)}
.logitem.undone{opacity:.55}
.small-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px;min-height:40px}
.small-btn .ic{width:18px;height:18px}
.filelist{display:grid;gap:8px;margin-top:12px}
.fileitem{display:grid;gap:6px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.fileitem .fn{font-weight:600;font-size:14px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.fileitem.bad{border-color:var(--out)}
.fileitem select{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600}
.progress{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 8px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
details.more{margin-top:14px}
details.more summary{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 0;min-height:44px;display:flex;align-items:center}

/* toast & busy */
#toast{position:fixed;inset-inline:12px;bottom:96px;z-index:40;display:flex;justify-content:center;pointer-events:none}
#toast .t{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-weight:600;max-width:560px}
#toast .t button{border:0;border-radius:10px;padding:6px 12px;background:var(--bg);color:var(--ink);font-weight:700;min-height:40px}
#busy{position:fixed;inset:0;z-index:50;background:rgba(10,20,22,.35);display:grid;place-items:center}
#busy .b{background:var(--surface);border-radius:18px;padding:18px 26px;text-align:center;font-weight:700;box-shadow:var(--shadow)}
#busy .spin{margin:6px auto 12px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
a.mitem{text-decoration:none;color:inherit}
.kp-show.dots{letter-spacing:10px}
.pin-err{color:var(--out);font-weight:700;text-align:center;margin:10px 0 0}
.send-btn{height:46px;padding:0 13px;border-radius:12px;border:0;background:var(--in);color:#fff;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:15px;box-shadow:var(--shadow);flex:none}
.send-btn .ic{width:21px;height:21px}
.send-btn[hidden]{display:none}
.big.go{background:var(--in)}
.sh-foot .big{width:100%}
.xfile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.xfile .xl{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;background:#1d6f42;color:#fff;flex:none}
.xfile .xl .ic{width:30px;height:30px}
.xfile b{display:block;font-size:16px;overflow-wrap:anywhere}
.xfile small{display:block;color:var(--muted);margin-top:4px;font-size:13.5px}
.lead .ic{width:22px;height:22px;vertical-align:-4px;color:var(--in)}
.wa-steps{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:16px 0 4px}
.wa-steps .st{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
.wa-steps .em{font-size:28px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--in-soft);font-family:var(--emoji)}
.wa-steps .ar{color:var(--muted);font-size:20px;margin-top:16px}
.wa-steps small{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.3}
.arn{display:block;font-size:13.5px;line-height:1.35;color:var(--muted);font-weight:600;direction:rtl;text-align:right}
.wname+.arn{font-size:16px;margin-top:2px}
.wrow .wn,.wrow .ws{display:block}
html.big body{font-size:19px}
html.big .wrow .wn{font-size:19px}
html.big .wrow .ws,html.big .arn{font-size:16px}
html.big .wname{font-size:25px}
html.big .wname+.arn{font-size:19px}
html.big .lead{font-size:21px}
html.big .wsub,html.big .muted,html.big .warnbox,html.big .banner,html.big .small-btn,html.big .chip,html.big .opt,html.big .status{font-size:16.5px}
html.big .tile span{font-size:20px}
html.big .tile small,html.big .mitem small,html.big .stat span{font-size:15px}
html.big .big{font-size:23px;min-height:72px}
html.big .sh-head h2{font-size:22px}
html.big .mitem{font-size:19px}
html.big .stat b{font-size:25px}
html.big .cmp-d,html.big .cmp-alert,html.big .cmp-tile .cmp-l{font-size:16px}
.sh-head .icon-btn.say{margin-inline-start:auto}
.mitem.tog .sw{margin-inline-start:auto;width:46px;height:28px;border-radius:14px;background:var(--idle-soft);border:1px solid var(--line);position:relative;flex:none}
.mitem.tog .sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:inset-inline-start .15s}
.mitem.tog.on .sw{background:var(--in);border-color:var(--in)}
.mitem.tog.on .sw::after{inset-inline-start:20px}
.mitem.on{border-color:var(--accent);background:var(--in-soft)}
.cmp-head{display:grid;gap:8px;margin-bottom:12px}
.cmp-file{display:flex;gap:10px;align-items:center}
.cmp-head .cmp-file b{font-size:15px}
.cmp-head .cmp-file small{display:inline;margin-inline-start:6px}
.cmp-head .cmp-file span{display:block}
.cmp-file b{display:block;overflow-wrap:anywhere}
.cmp-file small{display:block;color:var(--muted);font-size:13px}
.cmp-btns{display:flex;flex-wrap:wrap;gap:8px}
.cmp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:start;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);border-inline-start-width:6px;min-height:68px}
.cmp-tile .ic{grid-row:1/3;width:22px;height:22px}
.cmp-tile .cmp-n{font-size:24px;font-weight:800;line-height:1.1}
.cmp-tile .cmp-l{font-size:13px;color:var(--muted);font-weight:600}
.cmp-tile.t-warn{border-inline-start-color:var(--warn)}.cmp-tile.t-warn .ic{color:var(--warn)}
.cmp-tile.t-out{border-inline-start-color:var(--out)}.cmp-tile.t-out .ic{color:var(--out)}
.cmp-tile.t-in{border-inline-start-color:var(--in)}.cmp-tile.t-in .ic{color:var(--in)}
.cmp-tile.t-info{border-inline-start-color:var(--h-a)}.cmp-tile.t-info .ic{color:var(--h-a)}
.cmp-tile.on{border-color:var(--ink);box-shadow:var(--shadow)}
.cmp-list{display:grid;gap:10px}
.cmp-item{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.cmp-item .small-btn{justify-self:start}
.cmp-ds{display:grid;gap:4px;padding-inline-start:8px}
.cmp-d{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;background:var(--warn-soft);border-radius:10px;padding:6px 10px}
.cmp-d.minor{background:var(--idle-soft)}
.cmp-d b{min-width:84px}
.cmp-d .v{font-weight:700}
.cmp-alert{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:600}
.wrow.static{cursor:default}
.cmp .wrow.sel .tickbox{background:var(--in);border-color:var(--in)}
.cmp .wrow.unsel .tickbox{border-color:var(--idle)}
.cmp .wrow.unsel .tickbox .ic{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function kpHits(val, onlyPresent, exactOnly) {
  if (val.length < 3) return [];
  const out = [];
  for (const w of S.workers.values()) {
    if (w.label || (onlyPresent && w.code !== 1)) continue;
    const e = idNorm(w.emp), q = idNorm(w.iq); let sc = 0;
    if (e === val || q === val) sc = 3; else if (!exactOnly && e.startsWith(val)) sc = 2; else if (!exactOnly && val.length >= 5 && q.startsWith(val)) sc = 1;
    if (sc) out.push([sc, w]);
  }
  return out.sort((a, b) => b[0] - a[0] || (b[1].code || 0) - (a[1].code || 0)).slice(0, 5).map(x => x[1]);
}
function miniWorker(w) {

  return `<div class="wrow" style="cursor:default"><span class="flag emoji">${natFlag(w.nat)}</span><span class="wb"><span class="wn">${esc(displayName(w.name) || 'بدون اسم')}</span>
    <span class="ws"><span class="num">${esc(w.emp || w.iq || '')}</span>${j ? ` · <span class="emoji">${j.e}</span> ${esc(j.ar)}` : ''}</span></span>${w.room != null && w.h ? `<span class="rbadge num">${w.room}</span>` : ''}</div>`;
}
async function readAndContinue(input) {
  go('reading');
  try {
    const res = await readMessage(input);
    if (!F) return;
    F.hist.pop();
    if (res.drafts.length && ((F.kind === 'add' && res.action === 'exit') || (F.kind === 'exit' && res.action === 'add'))) { F.parsed = res; go('switch'); return; }
    continueParsed(res);
  } catch (e) {
    if (!F) return; F.hist.pop();
    F.err = e && (e.code === 'ocrempty' || e.code === 'ocr') ? 'ما قدرت أقرأ الصورة. جرّب «لصق الرسالة» أو «الأرقام».' : e && (e.code === 'net' || e.code === 'nogs') ? 'ما فيه اتصال بالإنترنت. جرّب مرة ثانية.' : 'ما قدرت أقرأ الرسالة. جرّب مرة ثانية أو استخدم الأرقام.';
    go('error');
  }
}
function continueParsed(res) {
  if (F.kind === 'add') {
    if (!res.drafts.length) { F.err = 'ما قدرت أقرأ بيانات عامل من الرسالة'; go('error'); return; }
    F.queue = res.drafts.map(enrich); F.qi = 0; F.d = F.queue[0];
    if (F.d.h) F.h = F.d.h;
    go('review');
  } else {
    const cands = []; for (const d of res.drafts) for (const w of findMatches(d, true, true)) if (!cands.includes(w)) cands.push(w);
    F.cands = cands; const d0 = res.drafts[0];
    if (d0 && d0.exit) { F.reason = d0.exit; F.site = d0.site || ''; F.ret = d0.ret || ''; }
    if (res.drafts.length > 1) {   // one message about several workers: one screen for all of them
      const list = [], missing = [];
      for (const d of res.drafts) { const c = findMatches(d, true, true).filter(w => !list.includes(w)); if (c.length) list.push(c[0]); else missing.push(d); }
      if (list.length > 1) { F.multi = { list, sel: new Set(list.map(w => w.id)), missing }; go('multi'); return; }
    }
    if (cands.length === 1) { F.w = cands[0]; go(F.reason ? (F.reason === 'site' && !F.site ? 'site' : 'confirm') : 'reason'); }
    else go('pick');
  }
}
function kpDone() {
  const v = F.kp; if (!v) return;
  const field = F.kpField || 'emp';
  if (F.kind === 'add' && F.d && F.kpReturn) { F.d[field] = field === 'room' ? +v : v; if (field === 'emp' || field === 'iq') enrich(F.d); F.kpField = null; F.kpReturn = false; F.hist.pop(); Sheets.redraw(); return; }
  if (F.kind === 'add') {
    const d = blankDraft(); if (v.length >= 9) d.iq = v; else d.emp = v;
    F.queue = [enrich(d)]; F.qi = 0; F.d = F.queue[0]; if (F.d.h) F.h = F.d.h;
    go('review'); return;
  }
  const d = blankDraft(); if (v.length >= 9) d.iq = v; else d.emp = v;
  F.cands = findMatches(d, true);
  if (F.cands.length === 1) { F.w = F.cands[0]; go('reason'); } else go('pick');
}
async function saveMulti() {
  const M = F && F.multi; if (!M || F.saving || !F.reason) return; F.saving = true;
  const list = M.list.filter(w => M.sel.has(w.id)); const done = []; let failed = 0;
  try {
    for (let i = 0; i < list.length; i++) {
      busy(true, `جاري الحفظ… ${i + 1} من ${list.length}`);
      const cur = [...S.workers.values()].find(x => x.h === list[i].h && x.sig && x.sig === list[i].sig) || S.workers.get(list[i].id) || list[i];   // rows may have moved after a delete
      try { const r = await saveExit(cur, F.reason, F.site, F.ret); if (r) done.push(r); } catch (e) { console.warn('multi', e); failed++; }
    }
  } finally { busy(false); if (F) F.saving = false; }
  if (!F) return;
  F.multiRes = done; F.multiFail = failed; if (done.length) chime();

}
async function flowSave() {
  if (!F || F.saving) return; F.saving = true;
  busy(true, 'جاري الحفظ…');
  try {
    let res = null;
    if (F.kind === 'exit') res = await saveExit(F.w, F.reason, F.site, F.ret);
    else if (F.kind === 'move' || F.kind === 'return') res = F.kind === 'move' ? await saveMove(F.w, F.h, F.room) : await saveAdd({ ...blankDraft(), match: F.w }, F.h, F.room);
    else res = await saveAdd(F.d, F.h, F.room);

    F.res = res; chime();
    go('done');
  } catch (e) { console.warn(e); toast(errText(e)); }
  finally { busy(false); if (F) F.saving = false; }
